detail:
  batch_size: 1  # Applied to advanced_quantize, graph_quantize, evaluate
  gpu_device: cuda:0  # Available: cpu, cuda:0, cuda:1, cuda:2, cuda:3, cuda:4, cuda:5
  advanced_quantize[0]:
    weight:
      granularity: CHANNEL  # Available: CHANNEL
      calibration_method: MINMAX  # Available: MINMAX, HISTOGRAM, MOVING_AVERAGE_MINMAX, PERCENTILE
    activation:
      granularity: TOKEN  # Available: TENSOR, TOKEN
      calibration_method: MINMAX  # Available: MINMAX
    parameters:
      calibration:
        num_samples: 128
      clip: true  # Available: true, false
    # -- Manual Mixed Precision (optional) --
    # Override precision of specific layers on top of base scheme
    # Priority: Manual MP > Base scheme
    #
    # --- Example ---
    # mixed_precision:
    #   by_name:                          # Override by regex pattern
    #     "model.layers.0.*":
    #       weight:
    #         dtype: INT4
    #     "model.lm_head": null           # Skip quantization for this layer
  graph_optimize[0]:
    pattern_handlers:
    - PatternHandlerAdjustAdd
    - PatternHandlerAdjustNonContiguousConstantMathInput
    - PatternHandlerCanonicalizeConvolutionDefault
    - PatternHandlerCombineAddRelu
    - PatternHandlerCombineConvBN
    - PatternHandlerCombineConvBNRelu
    - PatternHandlerCombineConvRelu
    - PatternHandlerCombineConvTransposeBN
    - PatternHandlerCombineConvTransposeBNRelu
    - PatternHandlerCombineConvTransposeRelu
    - PatternHandlerCombineLinearRelu
    - PatternHandlerCombineMulRelu
    - PatternHandlerCommuteBNBeforeJoinOp
    - PatternHandlerCommuteBNBeforeLinearOp
    - PatternHandlerComposeErfFormulaIntoGelu
    - PatternHandlerComposeTanhFormulaIntoGelu
    - PatternHandlerDecomposeMaxDimKeepdimFalse
    - PatternHandlerDecomposePReluToReluMath
    - PatternHandlerFuseAffineInputToLinear
    - PatternHandlerFuseBNToConv
    - PatternHandlerFuseConsecutiveBatchNorm
    - PatternHandlerFuseConsecutiveCast
    - PatternHandlerFuseConsecutiveConcat
    - PatternHandlerFuseConsecutiveIdempotent
    - PatternHandlerFuseConsecutiveLogSoftmax
    - PatternHandlerFuseConsecutiveReshapeTranspose
    - PatternHandlerFuseConsecutiveSlice
    - PatternHandlerFuseConsecutiveUnsqueeze
    - PatternHandlerFuseConstantPath
    - PatternHandlerFuseInputScaleToConv
    - PatternHandlerFuseMathToConv
    - PatternHandlerFuseMathToLinear
    - PatternHandlerFusePadToConv
    - PatternHandlerFusePadToPool
    - PatternHandlerFuseReluPostfixToClamp
    - PatternHandlerFuseReluPrefixToClamp
    - PatternHandlerFuseMultiBranchReshapeTranspose
    - PatternHandlerFuseQKV
    - PatternHandlerFuseSplitConvConcat
    - PatternHandlerFuseUnsqueezeToReduce
    - PatternHandlerNormalizeSpatialMeanKeepdimFalse
    - PatternHandlerRemoveGraphAssertsPass
    - PatternHandlerRemoveBatchNormTracking
    - PatternHandlerRemoveCommonSubexpression
    - PatternHandlerRemoveDeadend
    - PatternHandlerRemoveDisabledAutocastWrapper
    - PatternHandlerRemoveDropout
    - PatternHandlerRemoveMonotoneBeforeRanking
    - PatternHandlerRemoveNoOpCast
    - PatternHandlerRemoveNoOpConcat
    - PatternHandlerRemoveNoOpExpand
    - PatternHandlerRemoveNoOpFlatten
    - PatternHandlerRemoveNoOpMath
    - PatternHandlerRemoveNoOpPad
    - PatternHandlerRemoveNoOpReshape
    - PatternHandlerRemoveNoOpSlice
    - PatternHandlerRemoveNoOpSplit
    - PatternHandlerRemoveNoOpSqueeze
    - PatternHandlerRemoveNoOpTranspose
    - PatternHandlerRemovePositive
    - PatternHandlerReplaceBatchNormWithConv
    - PatternHandlerReplaceBitwiseRightShiftWithDiv
    - PatternHandlerReplaceEinsumWithMatmul
    - PatternHandlerReplaceGatherWithConv
    - PatternHandlerReplaceGatherWithSliceReshape
    - PatternHandlerReplaceInplaceAdd
    - PatternHandlerReplaceInplaceHardswish
    - PatternHandlerReplaceInplaceIndexPut
    - PatternHandlerReplaceInplaceLeakyRelu
    - PatternHandlerReplaceInplaceMul
    - PatternHandlerReplaceInplaceRelu
    - PatternHandlerReplaceInplaceSilu
    - PatternHandlerReplaceMatmul2dWithLinear
    - PatternHandlerReplaceMatmul3dWithLinear
    - PatternHandlerReplaceMatmulWithLinear
  graph_quantize[0]:
    weight:
      granularity: CHANNEL  # Available: CHANNEL
      calibration_method: MINMAX  # Available: MINMAX, HISTOGRAM, MOVING_AVERAGE_MINMAX, PERCENTILE
    activation:
      granularity: TOKEN  # Available: TENSOR, TOKEN
      calibration_method: MINMAX  # Available: MINMAX
    # -- Manual Mixed Precision (optional) --
    # Override precision of specific modules/operators on top of base scheme
    # Can be used together with automatic_mixed_precision (Manual MP targets are excluded from AMP)
    # Priority: Manual MP > AMP > Base scheme
    #
    # --- Example ---
    # mixed_precision:
    #   by_operator:                    # Override by operator type
    #     LINEAR:
    #       weight:
    #         dtype: INT4
    #         granularity: GROUP
    #         group_size: 128
    #   by_module:                      # Override by NPIR module ID
    #     "42":
    #       weight:
    #         dtype: INT4               # Override only weight from base scheme
    #     "57": null                    # Skip quantization for this module
